name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 23.x, 24.x]

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install pnpm
              run: corepack enable && corepack prepare pnpm@10.10.0 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Test
              run: pnpm test

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: Type check
              run: pnpm exec tsc --noEmit

    publish:
        needs: test
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  fetch-tags: true

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  registry-url: "https://registry.npmjs.org"

            - name: Install pnpm
              run: corepack enable && corepack prepare pnpm@10.10.0 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Update package.json version
              run: pnpm version:current

            - name: Generate changelog
              run: pnpm run generate-changelog

            - name: Remove CHANGELOG.md from .gitignore for npm publish
              run: sed -i '/CHANGELOG.md/d' .gitignore

            - name: Publish to NPM
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Restore .gitignore
              run: echo "CHANGELOG.md" >> .gitignore

    dependency-policy:
        runs-on: ubuntu-24.04
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24
            - run: node scripts/lint-dependabot-policy.mjs
    dependency-validation:
        name: Dependency validation
        if: always() && github.event_name == 'pull_request'
        needs: ["test", "publish", "dependency-policy"]
        runs-on: ubuntu-24.04
        permissions: {}
        steps:
            - uses: legra-ai/github-actions/.github/actions/require-ci-success@3ace81c4ac6d64eb18bc1df4dd7248d8ff87b6e0
              with:
                  results: ${{ toJSON(needs) }}
